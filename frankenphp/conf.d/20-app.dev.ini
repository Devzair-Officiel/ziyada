; See https://docs.docker.com/desktop/networking/#i-want-to-connect-from-a-container-to-a-service-on-the-host
; See https://github.com/docker/for-linux/issues/264
; The `client_host` below may optionally be replaced with `discover_client_host=yes`
; Add `start_with_request=yes` to start debug session on each request
xdebug.client_host = host.docker.internal

; Augmenter la mémoire en dev (highlight_file peut être gourmand sur les fichiers vendor)
memory_limit = 256M

; Override de 10-app.ini pour permettre l'upload des vidéos produit (contrainte form = 50 Mo).
; Doit rester >= la limite définie dans src/Form/MediaType.php.
upload_max_filesize = 80M
post_max_size = 80M
